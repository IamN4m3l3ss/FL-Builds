<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallen Lineage Wiki</title>
<meta name="description" content="Fallen Lineage items with stats, powers and drop chances, every enemy, and a glossary of game terms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balthazar&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@500&display=swap">
<link rel="stylesheet" href="assets/css/core.css">
<link rel="stylesheet" href="assets/css/wiki.css">
</head>
<body data-page="wiki">
<header id="site-head"></header>
<div class="wiki">
  <aside class="wside" aria-label="Categories">
    <input class="field" id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search">
    <nav id="cats"></nav>
  </aside>
  <main class="wlist">
    <div class="whead">
      <div><h1 id="title">Items</h1><span class="muted" id="count"></span></div>
      <div class="wtools" id="tools"></div>
    </div>
    <div id="list" class="rows" role="list"></div>
  </main>
  <aside class="wdetail panel" id="detail" aria-live="polite" hidden></aside>
</div>
<footer id="site-foot"></footer>
<script src="assets/js/site.js"></script>
<script src="assets/js/wiki.js"></script>
</body>
</html>
