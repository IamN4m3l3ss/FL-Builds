<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passive Tree Planner</title>
<meta name="description" content="Interactive Fallen Lineage passive tree: hover any node to read it, click to plan a path, share the link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balthazar&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@500&display=swap">
<link rel="stylesheet" href="assets/css/core.css">
<link rel="stylesheet" href="assets/css/tree.css">
</head>
<body data-page="tree">
<header id="site-head"></header>
<div class="wrap">
  <header class="hero tight">
    <h1>Passive tree</h1>
    <p>Hover a node to read it (tap on a phone). Click a gate to start, then click connected nodes to plan a path. Pick a class on the right to see its super-class tree in the centre circle. The link updates as you go, so you can share it.</p>
  </header>
  <div class="tplan">
    <div class="panel" id="map"></div>
    <aside class="panel tside">
      <label class="label" for="cls">Class tree (centre of the map)</label>
      <div class="csel"><select id="cls" aria-label="Class"></select><select id="sup" aria-label="Super class"></select></div>
      <div class="pts"><b id="cpts">0</b><span>/ 6 class points</span></div>
      <label class="label" for="q">Search</label>
      <input id="q" type="search" placeholder="Bleed, crit, Blood Rite…" autocomplete="off">
      <div class="qn" id="qn"></div>
      <div class="pts"><b id="pts">0</b><span>points spent</span><button id="reset">Reset</button></div>
      <div id="picked"></div>
    </aside>
  </div>
</div>
<script src="assets/js/site.js"></script>
<script src="assets/js/treemap.js"></script>
<script src="assets/js/tree.js"></script>
<footer id="site-foot"></footer>
</body>
</html>
